<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- %SCHOOL_*% values come from src/school-config.ts at build time (vite.config.ts). -->
    <meta name="theme-color" content="%SCHOOL_themeColor%" />
    <!-- Opened from a home-screen icon, phones show the school without the address bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%SCHOOL_siteName%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <meta name="description" content="%SCHOOL_description%" />
    <link rel="canonical" href="%SCHOOL_siteUrl%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="%SCHOOL_siteName%" />
    <meta property="og:title" content="%SCHOOL_siteName% · %SCHOOL_tagline%" />
    <meta property="og:description" content="%SCHOOL_shareDescription%" />
    <meta property="og:url" content="%SCHOOL_siteUrl%" />
    <meta property="og:image" content="%SCHOOL_shareImageUrl%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="%SCHOOL_shareImageAlt%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SCHOOL_siteName% · %SCHOOL_tagline%" />
    <meta name="twitter:description" content="%SCHOOL_shareDescription%" />
    <meta name="twitter:image" content="%SCHOOL_shareImageUrl%" />
    <title>%SCHOOL_siteName% · %SCHOOL_tagline%</title>
    <!-- KakaoTalk's in-app browser hands the page to the phone browser before the 3D bundle loads. -->
    <script>if(/KAKAOTALK/i.test(navigator.userAgent))location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);</script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/school-main.ts"></script></body>
</html>
